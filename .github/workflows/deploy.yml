name: Deploy to Homelab

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 20m
          script_stop: true
          script: |
            set -eo pipefail

            echo "=== Starting deployment ==="

            cd ~/amigo || { echo "ERROR: ~/amigo directory not found"; exit 1; }
            echo "Working directory: $(pwd)"

            # Pull latest code
            echo "=== Pulling latest code ==="
            git fetch origin main
            git reset --hard origin/main
            echo "Current commit: $(git rev-parse HEAD)"

            # Set build info
            BUILD_ID=$(git rev-parse --short HEAD)
            BUILD_DATE=$(date +"%d %b %Y, %H:%M")
            echo "Build ID: $BUILD_ID"
            echo "Build Date: $BUILD_DATE"

            # Enable BuildKit for better caching
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1

            # Build with cache (no pipe to preserve exit code)
            echo "=== Building Docker image ==="
            docker compose build \
              --build-arg NEXT_PUBLIC_BUILD_ID="$BUILD_ID" \
              --build-arg NEXT_PUBLIC_BUILD_DATE="$BUILD_DATE" \
              --progress=plain

            # Quick restart
            echo "=== Restarting container ==="
            docker compose up -d --force-recreate --no-build

            # Wait for container to be healthy
            echo "=== Waiting for container to start ==="
            sleep 5

            # Clean up old images
            docker image prune -f

            # Show status
            echo "=== Deployment complete ==="
            echo "Deployed build: $BUILD_ID @ $BUILD_DATE"
            docker compose ps

            # Verify the container is running
            if docker compose ps | grep -q "Up"; then
              echo "SUCCESS: Container is running"
            else
              echo "ERROR: Container failed to start"
              docker compose logs --tail=50
              exit 1
            fi
