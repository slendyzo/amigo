name: Deploy to Homelab

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd ~/amigo

            # Pull latest code
            git pull origin main

            # Set build info
            export BUILD_ID=$(git rev-parse --short HEAD)
            export BUILD_DATE=$(date +"%d %b %Y, %H:%M")

            # Rebuild and restart container with build args
            docker compose down
            docker compose build --build-arg NEXT_PUBLIC_BUILD_ID=$BUILD_ID --build-arg NEXT_PUBLIC_BUILD_DATE="$BUILD_DATE"
            docker compose up -d

            # Clean up old images
            docker image prune -f

            # Show status
            echo "Deployed build: $BUILD_ID @ $BUILD_DATE"
            docker compose ps
