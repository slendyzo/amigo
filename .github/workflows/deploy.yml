name: Deploy to Homelab

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 20m
          script_stop: true
          script: |
            set -eo pipefail

            echo "=== Starting deployment ==="

            cd ~/amigo || { echo "ERROR: ~/amigo directory not found"; exit 1; }
            echo "Working directory: $(pwd)"

            # Pull latest code
            echo "=== Pulling latest code ==="
            git fetch origin main
            git reset --hard origin/main
            echo "Current commit: $(git rev-parse HEAD)"

            # Set build info — exported so docker-compose.yml args: picks them up
            export NEXT_PUBLIC_BUILD_ID=$(git rev-parse --short HEAD)
            export NEXT_PUBLIC_BUILD_DATE=$(date +"%d %b %Y, %H:%M")
            echo "Build ID: $NEXT_PUBLIC_BUILD_ID"
            echo "Build Date: $NEXT_PUBLIC_BUILD_DATE"

            # Pre-build: only stop containers + sanity-check disk. Do NOT
            # prune images here — that wipes the BuildKit layer cache and
            # forces npm install / prisma generate / next build to run from
            # scratch every push, blowing build times from ~90s to 5-12min.
            # Image cleanup happens AFTER the build instead (dangling-only).
            echo "=== Pre-build cleanup ==="
            docker container prune -f

            # Reap orphaned build processes from a previous run. If the SSH
            # session dies mid-build the build tree is left parented to init,
            # still holding ~3.5 GB. The memory cgroup then throttles on
            # memory.high rather than OOM-killing, so those orphans never die on
            # their own — they pin the container at its ceiling and starve the
            # running app until killed by hand (outage, 2026-07-26).
            #
            # The patterns below bracket their first character on purpose. This
            # whole script is visible in the remote shell's own command line, so
            # an unbracketed pattern matches THIS process and pkill SIGKILLs the
            # deploy itself (which is exactly what happened on run 30222204417).
            # `[n]ode_...` matches a real build process but not the literal text
            # here. $$ / $PPID are filtered too, in case a future edit
            # reintroduces a self-matching string in a comment.
            ORPHANS=$(pgrep -f "[n]ode_modules/.bin/next" 2>/dev/null | grep -vwE "$$|$PPID" || true)
            if [ -n "$ORPHANS" ]; then
              echo "WARNING: orphaned build processes from a previous run — reaping: $(echo $ORPHANS | tr '\n' ' ')"
              kill -9 $ORPHANS 2>/dev/null || true
              pkill -9 -f "[j]est-worker/processChild" 2>/dev/null || true
              sleep 3
            else
              echo "No orphaned build processes."
            fi

            echo "Disk before build: $(df -h / | tail -1 | awk '{print $5}')"
            echo "Mem before build: $(free -m | awk '/^Mem:/{print $7" MB available"}')"

            # Hard-fail if there isn't enough RAM headroom for the build. The
            # type-check phase peaks around 3.5 GB; refusing early gives a clear
            # error instead of a 20-minute stall that takes prod down with it.
            AVAIL_MB=$(free -m | awk '/^Mem:/{print $7}')
            if [ "$AVAIL_MB" -lt 3000 ]; then
              echo "ERROR: only ${AVAIL_MB} MB RAM available, need ~3000 MB."
              echo "Refusing to build — a starved build stalls instead of failing."
              free -m
              exit 1
            fi

            # Hard-fail if the disk is too tight for a clean build (~3 GB free
            # is the empirical floor — full Next.js + node_modules + Prisma).
            AVAIL_KB=$(df --output=avail / | tail -1 | tr -d ' ')
            if [ "$AVAIL_KB" -lt 3145728 ]; then
              echo "ERROR: less than 3 GB free on /. Refusing to build to avoid silent failure."
              df -h /
              # Try a one-shot recovery prune before giving up.
              docker image prune -af
              AVAIL_KB=$(df --output=avail / | tail -1 | tr -d ' ')
              if [ "$AVAIL_KB" -lt 3145728 ]; then
                exit 1
              fi
              echo "Recovered disk: $(df -h / | tail -1 | awk '{print $5}')"
            fi

            # Build new image. No --pull: keep the cached base layers; the
            # daily prune cron at 04:30 + monthly Renovate-style refresh will
            # surface stale-base concerns separately.
            echo "=== Building Docker image ==="
            docker compose build

            # Restart with new image — docker compose up -d already fails the
            # script (via set -e) if containers can't start, so no extra health
            # check is needed. Keeping the final command fast + quiet avoids a
            # drone-ssh race where the SSH session closes before the exit code
            # is read back, which shows up as a false-red "exit 255" in Actions.
            echo "=== Starting container ==="
            docker compose up -d

            # Verify the app actually serves traffic. `up -d` returning 0 only
            # means the container started, not that it works — a green deploy
            # with a dead app is the failure mode this catches.
            echo "=== Health check ==="
            HEALTHY=0
            for i in $(seq 1 20); do
              if curl -fsS --max-time 5 http://localhost:3000/api/health > /dev/null 2>&1; then
                HEALTHY=1
                echo "Healthy after ${i} attempt(s)"
                break
              fi
              sleep 3
            done
            if [ "$HEALTHY" -ne 1 ]; then
              echo "ERROR: app did not become healthy within 60s."
              docker compose ps
              docker compose logs --tail=50 amigo
              exit 1
            fi

            # Post-deploy: drop now-orphaned previous image (dangling only —
            # cache layers stay).
            echo "=== Post-deploy prune ==="
            docker image prune -f

            echo "=== Deployed: $NEXT_PUBLIC_BUILD_ID @ $NEXT_PUBLIC_BUILD_DATE ==="
