<!doctype html>
<html lang="en" class="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amigo · Screenshot expenses preview</title>
<style>
:root{color-scheme:light;--app-bg:#f4f3f9;--surface:#fff;--surface-2:#eeebfd;--line:rgba(23,22,31,.06);--line-strong:rgba(23,22,31,.12);--ink:#17161f;--ink-muted:#6b6880;--accent:#5f4be8;--accent-fg:#fff;--accent-tint:rgba(95,75,232,.10);--negative:#d64550;--ease:cubic-bezier(.16,1,.3,1);--shadow-pop:0 12px 32px rgba(23,22,31,.1)}
.dark{color-scheme:dark;--app-bg:#131218;--surface:#1c1b24;--surface-2:#2a2836;--line:rgba(255,255,255,.06);--line-strong:rgba(255,255,255,.12);--ink:#f0eff6;--ink-muted:#a5a2b8;--accent:#8b7bff;--accent-fg:#131218;--accent-tint:rgba(139,123,255,.14);--shadow-pop:0 12px 32px rgba(0,0,0,.5)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:var(--ink);background:var(--app-bg)}button,input,select,textarea{font:inherit}button{cursor:pointer;min-height:44px;border:0;border-radius:12px;background:var(--surface-2);color:var(--ink);padding:0 14px}button:hover{filter:brightness(1.08)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}input,select,textarea{min-width:0;min-height:44px;color:var(--ink);background:var(--app-bg);border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px}input[type=checkbox]{min-height:auto;width:19px;height:19px;accent-color:var(--accent);cursor:pointer}label{font-size:12px;color:var(--ink-muted);display:flex;flex-direction:column;gap:6px}h1{font-size:22px;margin:0;font-weight:650;letter-spacing:-.6px}p{margin:0}.preview{max-width:540px;margin:24px auto 16px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}.preview p{font-size:12px;color:var(--ink-muted);line-height:1.5}.preview strong{display:block;color:var(--ink);font-size:14px}.tools{display:flex;gap:6px}.tools button{font-size:12px;padding:0 10px}.stage{padding:0 16px 24px;display:flex;justify-content:center}.sheet{width:100%;max-width:540px;max-height:calc(100dvh - 115px);display:flex;flex-direction:column;overflow:hidden;background:var(--app-bg);border:1px solid var(--line-strong);border-radius:28px;box-shadow:var(--shadow-pop);animation:enter .45s var(--ease)}header{padding:22px 20px 14px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}.privacy{display:flex;gap:5px;align-items:center;color:var(--ink-muted);font-size:12px;margin-top:7px}.privacy svg{width:13px;height:13px}.close{background:var(--surface-2);font-size:24px;width:44px;padding:0}.body{padding:0 16px 16px;overflow:auto;overscroll-behavior:contain}.capture{background:var(--surface);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;justify-content:space-between}.capture label{color:var(--ink);font-size:13px}.capture small{display:block;color:var(--ink-muted);font-size:11px;line-height:1.5;margin-top:4px}.capture input{max-width:145px;font-size:13px}.count{display:flex;justify-content:space-between;color:var(--ink-muted);font-size:12px;padding:18px 3px 10px}.count strong{color:var(--ink);font-weight:600}.rows{display:grid;gap:10px}.row{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;transition:opacity .3s var(--ease)}.row.off{opacity:.5}.quick{display:grid;grid-template-columns:24px minmax(0,1fr) 94px;gap:8px;align-items:center}.check{width:28px;min-height:44px;display:flex;justify-content:center;align-items:center}.name{font-weight:550;font-size:15px}.amount{font-size:15px;font-weight:650;text-align:right;width:100%;padding:10px 8px}.meta{font-size:11px;line-height:1.5;color:var(--ink-muted);margin:8px 0 2px 32px;overflow-wrap:anywhere}.actions{margin-left:32px;display:flex;align-items:center;justify-content:space-between}.more{font-size:12px;background:transparent;color:var(--accent);padding:0 3px;display:flex;gap:8px;align-items:center}.remove{min-width:44px;background:transparent;color:var(--ink-muted);padding:0;font-size:18px}.remove:hover{color:var(--negative)}.extras{display:none;border-top:1px solid var(--line);padding-top:14px;margin-top:4px;grid-template-columns:1fr 1fr;gap:12px}.extras.open{display:grid;animation:enter .35s var(--ease)}.wide{grid-column:1/-1}.budget{flex-direction:row;align-items:center;min-height:44px;font-size:13px}.upload{width:100%;margin-top:12px;background:var(--accent-tint);color:var(--accent);font-size:13px;font-weight:550}.status{font-size:12px;color:var(--ink-muted);min-height:18px;margin:10px 3px 0;text-align:center}.footer{background:var(--surface);border-top:1px solid var(--line);padding:14px 20px max(16px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:18px;flex-shrink:0}.total{font-size:19px;font-weight:650;white-space:nowrap}.total span{display:block;color:var(--ink-muted);font-size:11px;font-weight:400;margin-bottom:3px}.save{flex:1;background:var(--accent);color:var(--accent-fg);min-height:48px;font-size:14px;font-weight:650}.save:disabled{opacity:.5;cursor:default}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--ink);border:1px solid var(--accent);border-radius:14px;padding:14px 20px;box-shadow:var(--shadow-pop);font-size:13px;z-index:2;display:none}.toast.show{display:block;animation:enter .4s var(--ease)}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(max-width:420px){.preview{margin:12px auto 10px}.stage{padding-bottom:0}.sheet{max-height:calc(100dvh - 88px);border-bottom-left-radius:0;border-bottom-right-radius:0}.capture{padding:12px;gap:8px;flex-wrap:wrap}.capture input{max-width:136px}.capture>div{min-width:110px}.quick{grid-template-columns:22px minmax(0,1fr) 81px;gap:6px}.name{padding:10px 8px}.meta,.actions{margin-left:28px}.footer{padding-left:16px;padding-right:16px;gap:12px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<div class="preview"><p><strong>Amigo · Design preview</strong>Sample data · nothing is saved</p><div class="tools"><button id="length">7 rows</button><button id="theme" aria-label="Switch color theme">Light</button></div></div>
<main class="stage"><section class="sheet" aria-label="From screenshots preview"><header><div><h1>From screenshots</h1><p class="privacy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Read privately on your device</p></div><button class="close" aria-label="Close preview" id="close">×</button></header>
<div class="body"><div class="capture"><div><label for="capture">Screenshot taken on</label><small>Used to resolve “Yesterday”</small></div><input id="capture" type="date" value="2026-10-04"></div><div class="count"><strong id="count">3 expenses found</strong><span>Review before adding</span></div><div class="rows" id="rows"></div><button class="upload" id="upload">＋ Add more screenshots</button><p class="status" id="status" aria-live="polite">Names and amounts are ready to edit.</p></div>
<footer class="footer"><div class="total"><span>Selected total</span><div id="total">€24.31</div></div><button class="save" id="save">Add 3 expenses</button></footer></section></main><div class="toast" id="toast" role="status"></div>
<script>
const initial=[['E002 Taveiro',6.99,'E002 Taveiro Taveiro, Centro'],['IKEA Taveiro',16.07,'IKEA Taveiro, Centro'],['IKEA Taveiro',1.25,'IKEA Taveiro, Centro']];let serial=0,seven=false;const rows=document.getElementById('rows');const money=n=>new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR'}).format(n);function date(){const d=new Date(document.getElementById('capture').value+'T12:00:00');d.setDate(d.getDate()-1);return d.toISOString().slice(0,10)}function showToast(message){const t=document.getElementById('toast');t.textContent=message;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}function update(){const selected=[...rows.children].filter(r=>r.querySelector('.selected').checked);const sum=selected.reduce((n,r)=>n+(Number(r.querySelector('.amount').value)||0),0);document.getElementById('total').textContent=money(sum);document.getElementById('save').textContent=`Add ${selected.length} expense${selected.length===1?'':'s'}`;document.getElementById('save').disabled=selected.length===0||selected.some(r=>Number(r.querySelector('.amount').value)<=0||!r.querySelector('.name').value.trim());document.getElementById('count').textContent=`${rows.children.length} expenses found`;[...rows.children].forEach(r=>r.classList.toggle('off',!r.querySelector('.selected').checked))}function add(name,amount,vendor){serial++;const r=document.createElement('article');r.className='row';r.innerHTML=`<div class="quick"><label class="check"><input type="checkbox" checked class="selected" aria-label="Include expense ${serial}"></label><input class="name" aria-label="Expense name ${serial}"><input class="amount" type="number" min="0.01" step="0.01" inputmode="decimal" aria-label="Amount in euros ${serial}"></div><p class="meta"></p><div class="actions"><button class="more" aria-expanded="false">More options <span>⌄</span></button><button class="remove" aria-label="Remove expense ${serial}">×</button></div><div class="extras"><label class="wide">Vendor<input class="vendor"></label><label>Date<input class="date" type="date"></label><label>Currency<select><option>EUR</option><option>USD</option><option>GBP</option></select></label><label>Category<select><option>Automatic</option><option>Food & drinks</option><option>Shopping</option><option>Transport</option></select></label><label>Account<select><option>No account</option><option>Millenniumbcp</option><option>Cash</option></select></label><label>Expense type<select><option>Automatic</option><option>Fixed</option><option>Variable</option><option>Lifestyle</option><option>Project</option></select></label><label>Projects<select><option>No project</option><option>Home</option><option>Travel</option></select></label><label class="wide">Note<textarea rows="2" placeholder="Add a note"></textarea></label><label class="budget wide"><input type="checkbox">Exclude from budget</label></div>`;r.querySelector('.name').value=name;r.querySelector('.amount').value=amount.toFixed(2);r.querySelector('.vendor').value=vendor;r.querySelector('.date').value=date();const meta=()=>r.querySelector('.meta').textContent=r.querySelector('.vendor').value+' · '+r.querySelector('.date').value+' · EUR';meta();r.addEventListener('input',()=>{meta();update()});r.querySelector('.more').onclick=e=>{const open=r.querySelector('.extras').classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',open);e.currentTarget.firstChild.textContent=open?'Fewer options ':'More options '};r.querySelector('.remove').onclick=()=>{r.remove();update()};rows.append(r);update()}function reset(){rows.replaceChildren();initial.forEach(x=>add(...x));if(seven)[['Groceries',23.48,'Continente Coimbra'],['Coffee',2.4,'Coffee shop'],['Lunch',12.5,'Restaurant'],['Fuel',35,'Galp']].forEach(x=>add(...x))}reset();document.getElementById('length').onclick=()=>{seven=!seven;reset();document.getElementById('length').textContent=seven?'3 rows':'7 rows'};document.getElementById('theme').onclick=()=>{const dark=document.documentElement.classList.toggle('dark');document.getElementById('theme').textContent=dark?'Light':'Dark'};document.getElementById('capture').onchange=()=>{if(!document.getElementById('capture').value)return;[...rows.children].forEach(r=>{r.querySelector('.date').value=date();r.querySelector('.date').dispatchEvent(new Event('input',{bubbles:true}))})};document.getElementById('upload').onclick=()=>{const b=document.getElementById('upload');b.disabled=true;b.textContent='Reading on your device…';document.getElementById('status').textContent='Demo: detecting notification amounts and vendors.';setTimeout(()=>{add('Bakery',4.2,'Padaria Coimbra');b.disabled=false;b.textContent='＋ Add more screenshots';document.getElementById('status').textContent='1 new expense detected · sample screenshot';},1400)};document.getElementById('save').onclick=()=>showToast('Preview only · '+document.getElementById('save').textContent.replace('Add','Would add'));document.getElementById('close').onclick=()=>showToast('Preview stays open so you can explore the flow.');
</script></body></html>
