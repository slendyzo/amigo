services:
  db:
    image: postgres:17-alpine
    container_name: amigo-db
    restart: always
    # Soft memory floor (cgroup v2 memory.low). Under host pressure the kernel
    # reclaims from the build instead of from the live database.
    mem_reservation: 384m
    environment:
      POSTGRES_USER: amigo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: amigo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amigo -d amigo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  amigo:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BUILD_ID: ${NEXT_PUBLIC_BUILD_ID:-dev}
        NEXT_PUBLIC_BUILD_DATE: ${NEXT_PUBLIC_BUILD_DATE:-unknown}
    container_name: amigo
    restart: always
    # Soft memory floor (cgroup v2 memory.low) so a concurrent `docker compose
    # build` can't reclaim the running app into swap. Not a hard limit — the app
    # can still burst above this; it just won't be the first thing evicted.
    mem_reservation: 768m
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://amigo:${POSTGRES_PASSWORD}@db:5432/amigo
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL}
      - AUTH_TRUST_HOST=true
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EXCHANGE_ENCRYPTION_KEY=${EXCHANGE_ENCRYPTION_KEY}
      - CRON_SECRET=${CRON_SECRET}
      - INE_HOUSING_INDEX_URL=${INE_HOUSING_INDEX_URL:-}
      - ZAI_API_KEY=${ZAI_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  pgdata:
