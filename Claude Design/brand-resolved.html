<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>amigo — brand</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..900,0..100,0..1&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  html, body { margin: 0; padding: 0; background: #2a2622; }
  body { font-family: 'General Sans', system-ui, sans-serif; }

  .dir {
    --paper: #f1ebdd;
    --paper-deep: #e8e0cc;
    --ink: #14140f;
    --ink-soft: #3d3a30;
    --ink-mute: #6b6655;
    --rule: #d8cdb1;
    --forest: #1e3a2c;
    --forest-deep: #122a1f;
    --gilt: #a8853a;
    --gilt-soft: #c9a85a;
    --crimson: #7a2820;
    --moss: #4a6b3f;
    font-family: 'General Sans', sans-serif;
    color: var(--ink);
  }
  .dir .num {
    font-family: 'Fraunces', 'Times New Roman', serif;
    font-feature-settings: "lnum" 1, "tnum" 1, "ss01" 1;
    font-variation-settings: "opsz" 144, "SOFT" 30;
  }
  .dir .display {
    font-family: 'Fraunces', 'Times New Roman', serif;
    font-variation-settings: "opsz" 144, "SOFT" 50, "WONK" 1;
    font-weight: 400;
    letter-spacing: -0.02em;
  }
  .dir .ital {
    font-family: 'Instrument Serif', 'Times New Roman', serif;
    font-style: italic;
  }

  .ab { box-sizing: border-box; width: 100%; height: 100%; overflow: hidden; position: relative; }

  .eyebrow {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 500;
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="brand-resolved.jsx"></script>
<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;
  function App() {
    return (
      <DesignCanvas title="amigo — brand" subtitle="Forest paper · bracket mark · Fraunces numerals · gilt 1pt rules">
        <DCSection id="brand" title="Resolved Direction">
          <DCArtboard id="cover" label="Cover" width={900} height={1200}>
            <Cover />
          </DCArtboard>
          <DCArtboard id="logo" label="Logo & mark" width={900} height={1200}>
            <Logo />
          </DCArtboard>
          <DCArtboard id="palette" label="Palette" width={900} height={1200}>
            <Palette />
          </DCArtboard>
          <DCArtboard id="type" label="Type & numerals" width={900} height={1200}>
            <Type />
          </DCArtboard>
          <DCArtboard id="applied" label="Applied — statement" width={900} height={1200}>
            <Applied />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
