<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>amigo — card anatomy</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin:0; padding:24px; background:var(--paper); box-sizing:border-box; display:grid; grid-template-columns: 1fr 1fr; gap:0; border:1px solid var(--ink); }
  .card { background: var(--paper-deep); padding: 22px; display: flex; flex-direction: column; gap: 12px; border-right: 1px solid var(--ink); }
  .card:last-child { border-right: none; }
  .row { display: flex; justify-content: space-between; align-items: baseline; }
  .eyebrow { font: var(--w-medium) 10px/1.4 var(--font-mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-mute); }
  .amount { font-family: var(--font-num); font-size: 40px; font-weight: 380; letter-spacing: -0.03em; color: var(--ink); line-height: 1; font-variant-numeric: tabular-nums; }
  .amount .cents { color: var(--ink-mute); font-size: 22px; }
  .meta { font: var(--w-regular) 12px/1.4 var(--font-sans); color: var(--ink-mute); }
  .delta { font-family: var(--font-num); font-size: 14px; color: var(--moss); font-weight: 400; }
  .rule-gilt { height: 1px; background: var(--gilt); opacity: 0.5; margin: 4px 0; }
  .bar { height: 4px; background: var(--paper); border: 1px solid var(--rule); position: relative; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--forest); width: 62%; }
  .bar-tick { position: absolute; left: 80%; top: -3px; bottom: -3px; width: 1px; background: var(--gilt); }
</style>
</head>
<body>
  <div class="card">
    <div class="row">
      <span class="eyebrow">Total Value</span>
      <span class="eyebrow" style="color:var(--gilt);">Apr · 2026</span>
    </div>
    <div class="amount">$27,270<span class="cents">.65</span></div>
    <div class="rule-gilt"></div>
    <div class="row">
      <span class="meta">3 holdings · synced 2m ago</span>
      <span class="delta">+$124.50 · +2.41%</span>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <span class="eyebrow">Survival Budget</span>
      <span class="eyebrow" style="color:var(--gilt);">$1,240 / $2,000</span>
    </div>
    <div class="amount">62<span class="cents">%</span></div>
    <div class="bar"><i></i><span class="bar-tick"></span></div>
    <div class="row">
      <span class="meta"><b style="color:var(--ink); font-family:var(--font-display); font-weight:400;">$760 free</b> · 11 days left</span>
      <span class="delta">on track</span>
    </div>
  </div>
</body>
</html>
