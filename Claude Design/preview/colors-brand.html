<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>amigo — brand color</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin:0; padding:24px; background:var(--paper); display:grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap:0; box-sizing:border-box; border:1px solid var(--ink); }
  .swatch { padding:18px; display:flex; flex-direction:column; justify-content:space-between; min-height:140px; border-right:1px solid var(--ink); }
  .swatch:last-child { border-right: none; }
  .swatch .hex { font: var(--w-medium) 13px/1 var(--font-mono); letter-spacing:0.04em; }
  .swatch .name { font-family: var(--font-display); font-size: 22px; font-weight: 380; letter-spacing: -0.02em; }
  .swatch .label {
    font: var(--w-medium) 10px/1 var(--font-mono);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: .85;
  }
  .forest    { background: var(--forest); color: var(--paper); }
  .forest .label { color: var(--gilt-soft); opacity: 1; }
  .deep      { background: var(--forest-deep); color: var(--paper); }
  .deep .label { color: var(--gilt-soft); opacity: 1; }
  .gilt      { background: var(--gilt); color: var(--ink); }
  .paper     { background: var(--paper-deep); color: var(--ink); }
</style>
</head>
<body>
  <div class="swatch forest">
    <div class="label">Primary · Forest</div>
    <div>
      <div class="name" style="font-size:36px;">Forest</div>
      <div class="hex" style="margin-top:6px;">#1E3A2C</div>
    </div>
  </div>
  <div class="swatch deep">
    <div class="label">Pressed</div>
    <div><div class="name">Forest Deep</div><div class="hex">#122A1F</div></div>
  </div>
  <div class="swatch gilt">
    <div class="label">Accent</div>
    <div><div class="name">Gilt</div><div class="hex">#A8853A</div></div>
  </div>
  <div class="swatch paper" style="border-right:none;">
    <div class="label" style="color:var(--ink-mute)">Card · inset</div>
    <div><div class="name">Bone Deep</div><div class="hex">#E8E0CC</div></div>
  </div>
</body>
</html>
