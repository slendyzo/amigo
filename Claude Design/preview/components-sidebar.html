<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>amigo — sidebar nav</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin:0; padding:0; background:var(--paper-deep); box-sizing:border-box; display:flex; min-height:100vh; }
  .sb { width: 244px; background: var(--paper); border-right: 1px solid var(--ink); padding: 22px 18px; display: flex; flex-direction: column; gap: 2px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 0 22px; border-bottom: 1px solid var(--gilt); margin-bottom: 14px; }
  .brand .mark { display: inline-flex; align-items: center; font-family: var(--font-display); font-size: 26px; font-weight: 360; color: var(--ink); line-height: 1; letter-spacing: -0.02em; }
  .brand .mark .dot { width: 4px; height: 4px; border-radius: 9999px; background: var(--gilt); display: inline-block; margin: 0 2px; }
  .brand .word { font-family: var(--font-display); font-size: 22px; font-weight: 360; letter-spacing: -0.045em; color: var(--ink); font-variation-settings: "opsz" 144, "SOFT" 30; }
  .group { font: var(--w-medium) 10px/1 var(--font-mono); letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-mute); padding: 18px 4px 8px; }
  .item {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 4px;
    font-family: var(--font-display);
    font-size: 17px; font-weight: 380; letter-spacing: -0.01em;
    color: var(--ink-soft);
    cursor: pointer;
    border-bottom: 1px solid transparent;
    transition: all 200ms var(--ease-out);
  }
  .item:hover { color: var(--ink); }
  .item.active { color: var(--ink); font-weight: 420; border-bottom-color: var(--gilt); }
  .item.active .bullet { background: var(--gilt); }
  .bullet { width: 4px; height: 4px; border-radius: 9999px; background: transparent; border: 1px solid var(--ink-mute); flex: none; }
  .item.active .bullet { border-color: var(--gilt); }
  .rest { flex: 1; }
</style>
</head>
<body>
  <aside class="sb">
    <div class="brand"><span class="mark">(<span class="dot"></span>)</span><span class="word">amigo</span></div>
    <div class="group">Ledger</div>
    <div class="item active"><span class="bullet"></span>Dashboard</div>
    <div class="item"><span class="bullet"></span>Expenses</div>
    <div class="item"><span class="bullet"></span>Portfolio</div>
    <div class="item"><span class="bullet"></span>Incomes</div>
    <div class="group">Atelier</div>
    <div class="item"><span class="bullet"></span>Projects</div>
    <div class="item"><span class="bullet"></span>Categories</div>
    <div class="item"><span class="bullet"></span>Bank accounts</div>
    <div class="group">Office</div>
    <div class="item"><span class="bullet"></span>Statements</div>
    <div class="item"><span class="bullet"></span>Settings</div>
  </aside>
  <div class="rest"></div>
</body>
</html>
