<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>amigo — buttons</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin:0; padding:28px; background:var(--paper-deep); box-sizing:border-box; display:flex; flex-direction:column; gap:14px; border:1px solid var(--rule); }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .btn {
    font-family: var(--font-display);
    font-size: 16px; font-weight: 400; letter-spacing: -0.005em;
    padding: 0 20px; height: 42px;
    border-radius: 4px;
    border: 1px solid transparent;
    display: inline-flex; align-items: center; gap: 10px;
    cursor: pointer; transition: all 200ms var(--ease-out);
  }
  .btn-primary { background: var(--forest); color: var(--paper); }
  .btn-primary:hover { background: var(--forest-soft); }
  .btn-secondary { background: var(--paper); color: var(--ink); border-color: var(--ink); }
  .btn-secondary:hover { background: var(--paper-soft); }
  .btn-ghost { background: transparent; color: var(--ink-soft); }
  .btn-ghost:hover { background: var(--paper-soft); }
  .btn-destructive { background: var(--paper); color: var(--crimson); border-color: var(--crimson); }
  .btn-destructive:hover { background: var(--crimson-tint); }
  .btn-sm { height: 30px; padding: 0 12px; font-size: 12px; border-radius: 4px; }
  .btn-lg { height: 48px; padding: 0 24px; font-size: 15px; }
  .label { font: var(--w-medium) 10px/1 var(--font-mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-mute); min-width: 110px; }
  svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .pill {
    height: 32px; padding: 0 16px;
    border-radius: 9999px;
    background: transparent;
    border: 1px solid var(--ink);
    color: var(--ink);
    font: var(--w-medium) 12px/1 var(--font-sans);
    letter-spacing: 0.04em;
    cursor: pointer;
  }
  .pill.active { background: var(--ink); color: var(--paper); }
</style>
</head>
<body>
  <div class="row"><span class="label">Primary</span>
    <button class="btn btn-primary"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add expense</button>
    <button class="btn btn-primary btn-lg">Continue</button>
    <button class="btn btn-primary btn-sm">Save</button>
  </div>
  <div class="row"><span class="label">Secondary</span>
    <button class="btn btn-secondary">Export</button>
    <button class="btn btn-secondary">Cancel</button>
    <button class="btn btn-ghost">Skip</button>
  </div>
  <div class="row"><span class="label">Pills · filter</span>
    <button class="pill active">All</button>
    <button class="pill">Survival</button>
    <button class="pill">Lifestyle</button>
    <button class="pill">Portfolio</button>
  </div>
  <div class="row"><span class="label">Destructive</span>
    <button class="btn btn-destructive">Delete account</button>
  </div>
</body>
</html>
