<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>amigo — body type</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin:0; padding:28px; background:var(--paper-deep); box-sizing:border-box; display:flex; flex-direction:column; gap:18px; border:1px solid var(--rule); }
  .row { display:grid; grid-template-columns: 130px 1fr; align-items:baseline; gap:22px; }
  .meta { font: var(--w-medium) 10px/1.4 var(--font-mono); color: var(--ink-mute); letter-spacing: 0.18em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="row"><div class="meta">Eyebrow · 11</div><div class="t-eyebrow">Total Value</div></div>
  <div class="row"><div class="meta">Body · 15</div><div class="t-body">Your survival budget covers fixed costs only.</div></div>
  <div class="row"><div class="meta">Small · 13</div><div class="t-small">Excludes project expenses by default.</div></div>
  <div class="row"><div class="meta">Meta · 11 mono</div><div class="t-meta">EUR · BINANCE · TODAY 14:32</div></div>
  <div class="row"><div class="meta">Mono · 13</div><div class="t-mono">npm install amigo</div></div>
  <div class="row"><div class="meta">Pull · 22 italic</div><div class="t-pull">a quiet ledger for the modern household</div></div>
</body>
</html>
