<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>amigo — living gauge</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin:0; padding:20px; background:var(--paper); box-sizing:border-box; display:grid; grid-template-columns: repeat(3, 1fr); gap:0; border:1px solid var(--ink); }
  .card { background: var(--paper-deep); padding: 22px 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; border-right: 1px solid var(--ink); }
  .card:last-child { border-right: none; }
  .gauge { width: 140px; height: 140px; position: relative; }
  .gauge svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .gauge .track { stroke: var(--rule); }
  .gauge .meter { stroke-linecap: butt; transition: stroke-dashoffset 600ms var(--ease-out); }
  .gauge .label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .pct { font-family: var(--font-num); font-size: 30px; font-weight: 380; letter-spacing: -0.02em; color: var(--ink); line-height: 1; font-variant-numeric: tabular-nums; }
  .of { font: var(--w-medium) 9px/1 var(--font-mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-mute); }
  .name { font-family: var(--font-display); font-size: 17px; font-weight: 380; letter-spacing: -0.01em; color: var(--ink); }
  .amt { font-family: var(--font-num); font-size: 12px; color: var(--ink-mute); font-variant-numeric: tabular-nums; }
  .tick { stroke: var(--gilt); stroke-width: 1; }
</style>
</head>
<body>
  <div class="card">
    <div class="gauge">
      <svg viewBox="0 0 100 100">
        <circle class="track" cx="50" cy="50" r="44" stroke-width="1.5" fill="none"/>
        <circle class="meter" cx="50" cy="50" r="44" stroke-width="6" fill="none" stroke="var(--forest)" stroke-dasharray="276.5" stroke-dashoffset="105.1"/>
        <line class="tick" x1="50" y1="2" x2="50" y2="8"/>
      </svg>
      <div class="label"><span class="pct">62%</span><span class="of">Used</span></div>
    </div>
    <div class="name">Survival Budget</div>
    <div class="amt">$1,240 / $2,000</div>
  </div>
  <div class="card">
    <div class="gauge">
      <svg viewBox="0 0 100 100">
        <circle class="track" cx="50" cy="50" r="44" stroke-width="1.5" fill="none"/>
        <circle class="meter" cx="50" cy="50" r="44" stroke-width="6" fill="none" stroke="var(--amber)" stroke-dasharray="276.5" stroke-dashoffset="49.8"/>
        <line class="tick" x1="50" y1="2" x2="50" y2="8"/>
      </svg>
      <div class="label"><span class="pct" style="color:var(--amber)">82%</span><span class="of">Used</span></div>
    </div>
    <div class="name">Lifestyle</div>
    <div class="amt">$615 / $750</div>
  </div>
  <div class="card">
    <div class="gauge">
      <svg viewBox="0 0 100 100">
        <circle class="track" cx="50" cy="50" r="44" stroke-width="1.5" fill="none"/>
        <circle class="meter" cx="50" cy="50" r="44" stroke-width="6" fill="none" stroke="var(--crimson)" stroke-dasharray="276.5" stroke-dashoffset="0"/>
        <line class="tick" x1="50" y1="2" x2="50" y2="8"/>
      </svg>
      <div class="label"><span class="pct" style="color:var(--crimson)">108%</span><span class="of">Over</span></div>
    </div>
    <div class="name">Project · Casa</div>
    <div class="amt">$5,420 / $5,000</div>
  </div>
</body>
</html>
