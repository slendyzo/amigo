<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>amigo — transaction row</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin:0; padding:18px; background:var(--paper); box-sizing:border-box; }
  .ledger { background: var(--paper-deep); border: 1px solid var(--ink); }
  .month {
    padding: 14px 22px;
    display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 1px solid var(--ink);
    background: var(--paper);
  }
  .month .label { font: var(--w-medium) 10px/1 var(--font-mono); letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-mute); }
  .month .total { font-family: var(--font-num); font-size: 18px; font-weight: 380; color: var(--ink); font-variant-numeric: tabular-nums; }
  .row {
    display: grid;
    grid-template-columns: 60px 1fr auto auto;
    align-items: baseline;
    gap: 18px;
    padding: 14px 22px;
    border-bottom: 1px solid var(--rule);
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: var(--paper); }
  .date { font-family: var(--font-num); font-size: 13px; color: var(--ink-mute); font-variant-numeric: tabular-nums; }
  .body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .name { font-family: var(--font-display); font-size: 17px; font-weight: 380; letter-spacing: -0.01em; color: var(--ink); line-height: 1.2; }
  .meta { font: var(--w-regular) 11px/1.4 var(--font-mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-mute); }
  .seal {
    font-family: var(--font-mono); font-size: 9px; font-weight: 500;
    letter-spacing: 0.2em; text-transform: uppercase;
    padding: 3px 8px;
    border: 1px solid var(--gilt);
    color: var(--gilt);
  }
  .seal.proj { border-color: var(--ink); color: var(--ink); }
  .amt { font-family: var(--font-num); font-size: 17px; font-weight: 400; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .amt.refund { color: var(--moss); }
</style>
</head>
<body>
  <div class="ledger">
    <div class="month"><span class="label">November · Two thousand twenty-five</span><span class="total">$1,247.30</span></div>
    <div class="row">
      <span class="date">Nov 14</span>
      <div class="body"><span class="name">Mercato Centrale</span><span class="meta">lifestyle · dining</span></div>
      <span class="seal">Lifestyle</span>
      <span class="amt">$12.40</span>
    </div>
    <div class="row">
      <span class="date">Nov 13</span>
      <div class="body"><span class="name">Rent · November</span><span class="meta">survival · fixed cost</span></div>
      <span class="seal">Survival</span>
      <span class="amt">$820.00</span>
    </div>
    <div class="row">
      <span class="date">Nov 12</span>
      <div class="body"><span class="name">IKEA · Bookcase</span><span class="meta">project · casa</span></div>
      <span class="seal proj">Casa</span>
      <span class="amt">$189.00</span>
    </div>
    <div class="row">
      <span class="date">Nov 11</span>
      <div class="body"><span class="name">FNAC · refund</span><span class="meta">lifestyle · returned</span></div>
      <span class="seal">Lifestyle</span>
      <span class="amt refund">($42.00)</span>
    </div>
  </div>
</body>
</html>
