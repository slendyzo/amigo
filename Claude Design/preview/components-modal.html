<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>amigo — modal</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin:0; padding:0; background:rgba(28, 38, 32, 0.55); box-sizing:border-box; min-height:420px; display:flex; align-items:center; justify-content:center; }
  .modal { width: 440px; background: var(--paper); border: 1px solid var(--ink); box-shadow: 0 24px 60px -20px rgba(28,38,32,0.4); }
  .head { padding: 24px 26px 16px; border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: baseline; }
  .head h3 { font-family: var(--font-display); font-size: 26px; font-weight: 380; letter-spacing: -0.02em; color: var(--ink); margin: 0; }
  .head h3 em { font-family: var(--font-italic); font-style: italic; }
  .head .x { width:24px; height:24px; border:none; background:transparent; color:var(--ink-mute); cursor:pointer; font-size: 16px; }
  .body { padding: 22px 26px; display: flex; flex-direction: column; gap: 18px; background: var(--paper-deep); }
  .field { display: flex; flex-direction: column; gap: 6px; }
  label { font: var(--w-medium) 10px/1.4 var(--font-mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-mute); }
  input, select {
    font: var(--w-regular) 15px/1 var(--font-sans);
    height: 36px; padding: 0 0 4px;
    border: none; border-bottom: 1px solid var(--ink);
    background: transparent; color: var(--ink);
  }
  input:focus, select:focus { outline: none; border-bottom: 2px solid var(--gilt); padding-bottom: 3px; }
  .amount-input { font-family: var(--font-num); font-size: 28px; font-weight: 380; letter-spacing: -0.02em; height: auto; padding-bottom: 6px; font-variant-numeric: tabular-nums; }
  .row { display: grid; grid-template-columns: 2fr 1fr; gap: 18px; }
  .actions { padding: 16px 26px 22px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--rule); }
  .seal { font: var(--w-medium) 10px/1 var(--font-mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--gilt); }
  .btns { display: flex; gap: 10px; }
  .btn { font: var(--w-medium) 13px/1 var(--font-sans); height: 38px; padding: 0 18px; border-radius: 4px; border: 1px solid transparent; cursor: pointer; }
  .btn-secondary { background: transparent; border-color: var(--ink); color: var(--ink); }
  .btn-primary { background: var(--forest); color: var(--paper); }
</style>
</head>
<body>
  <div class="modal">
    <div class="head"><h3>Add <em>expense</em></h3><button class="x">×</button></div>
    <div class="body">
      <div class="field"><label>Description</label><input value="Mercato Centrale" /></div>
      <div class="row">
        <div class="field"><label>Amount</label><input class="amount-input" value="$12.00" /></div>
        <div class="field"><label>Type</label><select><option>Lifestyle</option></select></div>
      </div>
      <div class="field"><label>Category</label><select><option>Dining (auto-matched)</option></select></div>
    </div>
    <div class="actions">
      <span class="seal">Draft · unsaved</span>
      <div class="btns">
        <button class="btn btn-secondary">Cancel</button>
        <button class="btn btn-primary">Save expense</button>
      </div>
    </div>
  </div>
</body>
</html>
