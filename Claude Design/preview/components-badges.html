<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>amigo — badges & chips</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin:0; padding:28px; background:var(--paper-deep); box-sizing:border-box; display:flex; flex-direction:column; gap:18px; border:1px solid var(--rule); }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .label { font: var(--w-medium) 10px/1.4 var(--font-mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-mute); min-width: 120px; }
  .chip {
    font-family: var(--font-mono); font-size: 11px; font-weight: 500;
    letter-spacing: 0.04em;
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid currentColor;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip-gain { background: var(--moss-tint); color: var(--moss); }
  .chip-loss { background: var(--crimson-tint); color: var(--crimson); }
  .chip-warn { background: var(--amber-tint); color: var(--amber); }
  .chip-neutral { background: var(--paper); color: var(--ink-mute); }
  .chip-pro { background: var(--forest); color: var(--paper); border-color: var(--forest); }
  .pill {
    font-family: var(--font-display);
    font-size: 15px; font-weight: 380; letter-spacing: -0.005em;
    padding: 4px 14px;
    border-radius: 9999px;
    background: var(--paper); border: 1px solid var(--ink);
    color: var(--ink);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .dot { width: 6px; height: 6px; border-radius: 9999px; display: inline-block; }
  .seal {
    font-family: var(--font-mono); font-size: 10px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    padding: 5px 12px;
    border: 1px solid var(--gilt);
    color: var(--gilt);
    background: transparent;
  }
</style>
</head>
<body>
  <div class="row"><span class="label">Status · P&amp;L</span>
    <span class="chip chip-gain">+2.41%</span>
    <span class="chip chip-loss">−0.83%</span>
    <span class="chip chip-warn">82% used</span>
    <span class="chip chip-neutral">Pending</span>
    <span class="chip chip-pro">Pro</span>
  </div>
  <div class="row"><span class="label">Project tags</span>
    <span class="pill"><span class="dot" style="background:var(--forest)"></span>Casa</span>
    <span class="pill"><span class="dot" style="background:var(--gilt)"></span>Vacation '26</span>
    <span class="pill"><span class="dot" style="background:var(--crimson)"></span>Wedding</span>
  </div>
  <div class="row"><span class="label">Seals · meta</span>
    <span class="seal">Survival · Fixed</span>
    <span class="seal">Lifestyle</span>
    <span class="seal">Portfolio</span>
  </div>
</body>
</html>
