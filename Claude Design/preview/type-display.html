<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>amigo — display type</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  body { margin:0; padding:32px; background:var(--paper-deep); box-sizing:border-box; display:flex; flex-direction:column; gap:22px; border:1px solid var(--rule); }
  .row { display:grid; grid-template-columns: 130px 1fr; align-items:baseline; gap:22px; }
  .meta { font: var(--w-medium) 10px/1.4 var(--font-mono); color: var(--ink-mute); letter-spacing: 0.18em; text-transform: uppercase; }
  .display-xl {
    font-family: var(--font-display);
    font-size: 64px;
    font-weight: 320;
    letter-spacing: -0.035em;
    line-height: 1;
    color: var(--ink);
    font-variation-settings: "opsz" 144, "SOFT" 50;
  }
  .display-xl em { font-family: var(--font-italic); font-style: italic; font-weight: 400; }
  .display-l {
    font-family: var(--font-display);
    font-size: 46px;
    font-weight: 360;
    letter-spacing: -0.025em;
    line-height: 1.05;
    color: var(--ink);
    font-variation-settings: "opsz" 144, "SOFT" 50, "WONK" 1;
  }
  .display-l em { font-family: var(--font-italic); font-style: italic; font-weight: 400; }
  .display-m {
    font-family: var(--font-display);
    font-size: 32px;
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.1;
    color: var(--ink);
  }
  .heading {
    font-family: var(--font-sans);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.015em;
    color: var(--ink);
  }
  .pull {
    font-family: var(--font-italic);
    font-style: italic;
    font-size: 26px;
    color: var(--ink-soft);
    line-height: 1.3;
  }
</style>
</head>
<body>
  <div class="row">
    <div class="meta">Display XL · 64</div>
    <div class="display-xl">a private <em>ledger.</em></div>
  </div>
  <div class="row">
    <div class="meta">Display L · 46</div>
    <div class="display-l">Bone paper. Forest <em>ink.</em></div>
  </div>
  <div class="row">
    <div class="meta">Display M · 32</div>
    <div class="display-m">Survival Budget</div>
  </div>
  <div class="row">
    <div class="meta">Pull · 26 italic</div>
    <div class="pull">quiet · capital · counsel</div>
  </div>
  <div class="row">
    <div class="meta">Heading · 22</div>
    <div class="heading">Bank Accounts</div>
  </div>
</body>
</html>
