<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8"/>
  <title>amigo · Screens</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <link rel="stylesheet" href="../colors_and_type.css"/>
  <link rel="stylesheet" href="screens.css"/>

  <style>
    /* canvas-level helpers */
    body { margin: 0; background: #f0eee9; }
    .frame-shell {
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 4px;
      background: var(--paper);
      border: 1px solid var(--rule);
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }
    /* the desktop screens are 1440 wide; we render them inside a 1440x900 artboard */
    .desk { width: 1440px; height: 900px; overflow: hidden; }
    .desk .app { height: 100%; }
    .desk .page { overflow-y: auto; height: calc(100% - 67px); }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="screen-primitives.jsx"></script>
  <script type="text/babel" src="dashboard-variants.jsx"></script>
  <script type="text/babel" src="add-expense-modal.jsx"></script>
  <script type="text/babel" src="portfolio-screen.jsx"></script>
  <script type="text/babel" src="mobile-screens.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const App = () => (
      <DesignCanvas>
        <DCSection
          id="desktop"
          title="Painel · Desktop"
          subtitle="Duas leituras do mesmo mês — escolhe a densidade."
        >
          <DCArtboard id="dash-a" label="A · Conta Corrente" width={1440} height={900}>
            <div className="frame-shell desk">
              <DashboardA/>
            </div>
          </DCArtboard>
          <DCArtboard id="dash-b" label="B · Mesa de Trabalho" width={1440} height={900}>
            <div className="frame-shell desk">
              <DashboardB/>
            </div>
          </DCArtboard>
        </DCSection>

        <DCSection
          id="modal"
          title="Adicionar Despesa · Desktop"
          subtitle="Manual · Recibo (IA) · Dividir — três modos no topo do modal."
        >
          <DCArtboard id="modal-manual" label="Manual" width={1440} height={900}>
            <div className="frame-shell desk" style={{ position: 'relative' }}>
              <DashboardA/>
              <AddExpenseModal initialMode="manual"/>
            </div>
          </DCArtboard>
          <DCArtboard id="modal-receipt" label="Recibo · IA" width={1440} height={900}>
            <div className="frame-shell desk" style={{ position: 'relative' }}>
              <DashboardA/>
              <AddExpenseModal initialMode="receipt"/>
            </div>
          </DCArtboard>
          <DCArtboard id="modal-split" label="Dividir" width={1440} height={900}>
            <div className="frame-shell desk" style={{ position: 'relative' }}>
              <DashboardA/>
              <AddExpenseModal initialMode="split"/>
            </div>
          </DCArtboard>
        </DCSection>

        <DCSection
          id="portfolio"
          title="Portfolio · Ativos"
          subtitle="Património, alocação e posições — uma visão de carteira."
        >
          <DCArtboard id="port" label="Ativos" width={1440} height={900}>
            <div className="frame-shell desk">
              <PortfolioScreen/>
            </div>
          </DCArtboard>
        </DCSection>

        <DCSection
          id="mobile"
          title="Mobile · iPhone"
          subtitle="Painel + dois padrões para registar uma despesa."
        >
          <DCArtboard id="m-dash" label="Painel" width={440} height={900}>
            <IOSDevice width={402} height={874}>
              <MobileDashboard/>
            </IOSDevice>
          </DCArtboard>
          <DCArtboard id="m-sheet" label="Add · Bottom Sheet" width={440} height={900}>
            <IOSDevice width={402} height={874}>
              <MobileAddSheet/>
            </IOSDevice>
          </DCArtboard>
          <DCArtboard id="m-full" label="Add · Full-screen" width={440} height={900}>
            <IOSDevice width={402} height={874}>
              <MobileAddFullscreen/>
            </IOSDevice>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
